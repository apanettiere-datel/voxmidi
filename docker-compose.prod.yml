version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - upload_tmp:/tmp/voxmidi
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

volumes:
  upload_tmp:
