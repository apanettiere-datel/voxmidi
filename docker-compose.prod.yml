# The Lightsail host runs its own nginx on port 80 (routes voxmidi.com and other
# apps): it serves the frontend from /var/www/voxmidi and proxies /api to
# 127.0.0.1:3002. So prod runs the backend container only; no nginx container.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:3002:8080"
    env_file: ./backend/.env
    volumes:
      - ./backend/data:/app/data
      - upload_tmp:/tmp/voxmidi
    environment:
      - PYTHONUNBUFFERED=1
    restart: always

volumes:
  upload_tmp:
